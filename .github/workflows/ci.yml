name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · lint+typecheck+test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-13, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 版本读取根 package.json 的 packageManager 字段

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch pandoc sidecar (SHA-256 verified)
        run: pnpm setup

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests (real pandoc, golden samples)
        run: pnpm test:integration

      - name: Desktop unit + integration (M4)
        run: |
          pnpm --filter @md2word/desktop test
          pnpm --filter @md2word/desktop test:integration

      - name: Desktop E2E (Playwright _electron)
        run: pnpm --filter @md2word/desktop e2e

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            coverage/
            docs/tests/
          if-no-files-found: ignore
