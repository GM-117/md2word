name: CI

on:
  push:
    branches: [main]
    # 文档类改动（根目录 *.md / docs/**）不消耗三平台额度；含代码的提交不受影响
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'docs/**'

# 同分支/PR 有新推送时取消在跑的旧 run——macOS 计费倍率 ×10，这是最有效的省钱项
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 敏感信息扫描（公开仓库免费）：全历史 + 官方 gitleaks 规则集，本地 pre-commit 之外的服务端兜底
  secrets:
    name: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: ${{ matrix.os }} · lint+typecheck+test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-13 已被 GitHub 降级排队（实测等待 runner 24h 超时），改用 macos-15
        os: [macos-14, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 版本读取根 package.json 的 packageManager 字段

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch pandoc sidecar (SHA-256 verified)
        run: pnpm setup

      # 全新 clone 无 core dist（@md2word/core 的 types/main 指向 dist），
      # 跨包 typecheck/测试前必须先构建（本地有历史 dist 掩盖了此问题，D38）
      - name: Build packages
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests (real pandoc, golden samples)
        run: pnpm test:integration

      - name: Desktop unit + integration (M4)
        run: |
          pnpm --filter @md2word/desktop test
          pnpm --filter @md2word/desktop test:integration

      - name: Desktop E2E (Playwright _electron)
        run: pnpm --filter @md2word/desktop e2e

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            coverage/
            docs/tests/
          if-no-files-found: ignore
