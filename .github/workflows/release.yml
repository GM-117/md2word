name: Release

# M4/M5 启用：tag 触发 → electron-builder 三平台产物 → GitHub Release
# 当前为骨架（M0），保持空跑通过；electron-builder 接入后由 M4 补全。
on:
  push:
    tags:
      - 'v*'

# 建 Release + 上传产物 + SHA-256 清单回传均需写权限（默认只读 token 会 403）
permissions:
  contents: write

# 重推同名 tag（修复后重建）时取消旧构建，避免旧 run 往同一 Release 竞争上传；
# 不同 tag 各自成组，v0.1.1 与 v0.1.0 可并行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: build & publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            args: --arm64
          # x64 dmg 在 arm64 runner 上交叉构建（本机 M4 已验证同路径可行）；
          # macos-13 已被 GitHub 降级排队（CI 实测等待 runner 24h 超时），不再使用
          - os: macos-14
            args: --x64
          - os: windows-2022
            args: ''
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch pandoc sidecar
        run: pnpm setup

      # 交叉构建：pnpm setup 只拉当前架构，x64 作业需显式补 darwin-x64 sidecar
      # （fetch-pandoc 支持平台覆盖参数；prepare-resources 按 --x64 暂存对应架构）
      - name: Fetch darwin-x64 sidecar (cross-arch build)
        if: matrix.args == '--x64'
        run: node packages/core/scripts/fetch-pandoc.mjs darwin-x64

      - name: Build packages
        run: pnpm build

      - name: Build desktop installers (electron-builder)
        run: pnpm --filter @md2word/desktop dist ${{ matrix.args }}

      - name: Verify bundle (pandoc sidecar + GPL notice + renderer)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            APP_DIR=$(find packages/desktop/release -maxdepth 2 -name "md2word.app" | head -1)
            node packages/desktop/scripts/verify-dist.mjs "$APP_DIR"
          else
            node packages/desktop/scripts/verify-dist.mjs packages/desktop/release/win-unpacked --win
          fi

      - name: Upload installers to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.exe
          generate_release_notes: true

  # 矩阵各 runner 只持本平台产物：SHA-256 清单待三平台全部上传后统一下载汇总，
  # 避免各 runner 各自生成的清单相互覆盖（开发计划 §6.3：Release 附 SHA-256 清单）
  sha256-manifest:
    name: attach SHA-256 manifest
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --dir release-assets --clobber

      - name: Generate SHA256SUMS.txt
        run: node packages/desktop/scripts/release-sha256.mjs release-assets

      - name: Upload manifest to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" release-assets/SHA256SUMS.txt --repo "${{ github.repository }}" --clobber
